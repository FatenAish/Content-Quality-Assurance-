name: One-time internal-link intent mismatch fix

on:
  push:
    paths:
      - '.github/workflows/patch-internal-link-intent.yml'
      - 'scripts/patch_internal_link_intent.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch app.py
        run: |
          python scripts/patch_internal_link_intent.py
          python -m py_compile app.py
      - name: Commit fixed app.py
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Catch internal property-type and sale-rent link mismatches"
          git push origin main
