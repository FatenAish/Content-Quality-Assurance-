name: Run robust v18.56 clear results patch

on:
  push:
    paths:
      - '.github/workflows/run-v1856b-clear-results.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch app
        run: python scripts/patch_v1856b_clear_results.py
      - name: Validate app
        run: python -m py_compile app.py
      - name: Commit app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Make issue results concise and grouped"
          git push origin main
# retry after patch-script fix
