name: One-time homepage internal-link fix

on:
  push:
    paths:
      - '.github/workflows/patch-homepage-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch app.py
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              'APP_VERSION = "V18.48 SPEED OPTIMIZED FULL QA"\nENGINE_BUILD = "2026.08.16.48"',
              'APP_VERSION = "V18.52 HOMEPAGE INTERNAL LINK FIX"\nENGINE_BUILD = "2026.08.16.52"',
              "version",
          )

          replace_once(
              '''        else:\n            anchor_slug_overlap = 0.0\n\n        inventory.append({\n            "url": href,\n            "anchor_text": anchor_text,\n            "is_internal": is_internal,\n            "empty_anchor": False,\n            "generic_anchor": generic_anchor,\n            "suspicious_anchor": suspicious_anchor,\n            "anchor_slug_overlap": anchor_slug_overlap,\n        })''',
              '''        else:\n            anchor_slug_overlap = 0.0\n\n        # Homepage URLs have no meaningful slug. Do not treat a valid brand/home\n        # link such as Bayut.com -> / as an anchor-to-slug mismatch. This also\n        # covers http/https and www/non-www variants of the same homepage.\n        is_homepage_destination = (parsed.path or "/") in {"", "/"}\n\n        inventory.append({\n            "url": href,\n            "anchor_text": anchor_text,\n            "is_internal": is_internal,\n            "empty_anchor": False,\n            "generic_anchor": generic_anchor,\n            "suspicious_anchor": suspicious_anchor,\n            "anchor_slug_overlap": anchor_slug_overlap,\n            "is_homepage_destination": is_homepage_destination,\n        })''',
              "inventory homepage flag",
          )

          replace_once(
              '''        if not looks_like_entity_phrase(anchor):\n            continue\n        # Most correct named links already match their destination slug.''',
              '''        if not looks_like_entity_phrase(anchor):\n            continue\n        # A homepage has no useful path slug/title relationship for this heuristic.\n        # Skip destination-title mismatch checks for valid internal home links.\n        if item.get("is_homepage_destination"):\n            continue\n        # Most correct named links already match their destination slug.''',
              "homepage title check",
          )

          replace_once(
              '''        if (\n            item["anchor_text"]\n            and len(tokenize(item["anchor_text"])) >= 2\n            and item["anchor_slug_overlap"] < 0.12\n        ):''',
              '''        if (\n            item["anchor_text"]\n            and len(tokenize(item["anchor_text"])) >= 2\n            and item["anchor_slug_overlap"] < 0.12\n            and not item.get("is_homepage_destination")\n        ):''',
              "homepage slug mismatch check",
          )

          path.write_text(text, encoding="utf-8")
          PY

          python -m py_compile app.py

      - name: Commit fixed app.py
        shell: bash
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes detected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Fix homepage internal-link false positive"
          git push origin main
