name: Run v18.58 editorial init fix

on:
  push:
    paths:
      - '.github/workflows/run-v1858-editorial-init.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch app
        run: python scripts/patch_v1858_editorial_init.py
      - name: Validate app
        run: python -m py_compile app.py
      - name: Commit app and clean temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git rm scripts/patch_v1858_editorial_init.py
          git rm .github/workflows/run-v1858-editorial-init.yml
          git commit -m "Fix editorial quality initialization"
          git push origin main
